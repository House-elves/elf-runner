name: Release

# A tag v1.2.3 publishes elf-runner.jar (the runner with its dependencies) on a GitHub release, where
# house-elves install downloads it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: jbangdev/setup-jbang@main
      - run: jbang export fatjar --output elf-runner.jar ElfRunner.java
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" elf-runner.jar --title "Elf runner $GITHUB_REF_NAME" --generate-notes
